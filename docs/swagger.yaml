      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.productDetailsByIdResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Details
      tags:
        - Products
  /api/search/cars:
    get:
      description: Realiza uma pesquisa de carros
      parameters:
        - description: Pesquisa
          in: query
          name: search
          required: true
          type: string
        - description: 'limite de resultados (padrão: 100)'
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
