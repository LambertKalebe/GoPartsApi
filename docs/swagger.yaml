  /api/system/health:
    get:
      description: Verifica se a API está online
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.healthResponse'
      summary: Check
      tags:
        - System
  /api/system/logstream:
    get:
      description: Transmite os logs do sistema em tempo real usando Server-Sent Events
        (SSE)
      produces:
        - text/event-stream
      responses:
        "200":
          description: Stream SSE de logs
          schema:
            type: string
        "500":
          description: Streaming não suportado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Stream de logs
      tags:
        - System
  /api/system/restart:
    post:
      description: Reinicia o servidor
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Restart
      tags:
