info:
  contact: { }
paths:
  /api/appbuilder:
    post:
      consumes:
        - application/json
      description: Realiza uma consulta de carros por um request de uma ou mais linhas
      parameters:
        - description: Linhas de pesquisa
          in: body
          name: search
          required: true
          schema:
            $ref: '#/definitions/appbuilder.appBuilderSearchRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appbuilder.appBuilderResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Search
      tags:
        - AppBuilder
  /api/auth/aboutme:
    get:
      description: Retorna informações do usuário.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.aboutMeResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: aboutMe
      tags:
        - Auth
  /api/auth/login:
    post:
      consumes:
        - application/json
      description: Realiza um login de usuário
      parameters:
        - description: Credenciais
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/auth.loginRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.loginResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Login
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: Apaga os cookies do usuário.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.logoutResponse'
      summary: Logout
      tags:
        - Auth
  /api/auth/register:
    post:
      consumes:
        - application/json
      description: Cria um novo usuário.
      parameters:
        - description: Dados do usuário
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/auth.registerRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.registerResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Register
      tags:
        - Auth
  /api/export/apps:
    post:
      description: Baixa as aplicações informadas no formato de csv
      parameters:
        - description: Ids dos veiculos
          in: body
          name: id
          required: true
          schema:
            $ref: '#/definitions/download.appDownloadRequest'
      produces:
        - text/csv
      responses:
        "200":
          description: Arquivo CSV
          schema:
            type: file
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Applications
      tags:
        - Download
  /api/export/images:
    get:
      description: Baixa todas as imagens de um produto
      parameters:
        - description: Nome base dos arquivos
          in: query
          name: fileName
          required: true
          type: string
        - description: ID do produto
          in: query
          name: id
          required: true
          type: integer
        - description: Indice da imagem
          in: query
          name: index
          required: true
          type: integer
      produces:
        - image/png
        - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: Images
      tags:
        - Download
  /api/products:
    get:
      description: Realiza uma consulta de produtos por paginação
      parameters:
        - default: 100
          description: Quantidade máxima de produtos por página
          in: query
          maximum: 500
          minimum: 1
          name: limit
          type: integer
        - description: Somente produtos públicos
          in: query
          name: publicOnly
          type: boolean
        - description: Página desejada
          in: query
          name: page
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.productsResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: List
      tags:
        - Products
  /api/products/{id}:
    get:
      description: Realiza uma consulta basica de um produto com base no seu ID
      parameters:
        - description: ID do produto
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/products.productByIdResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "404":
          description: Recurso não encontrado
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/httpcustom.ErrorResponse'
      summary: ID
      tags:
        - Products
  /api/products/{id}/details:
    get:
      description: Realiza uma consulta completa de um produto com base no seu ID
      parameters:
        - description: ID do produto
          in: path
          name: id
          required: true
          type: integer
      produces:
